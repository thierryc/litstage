name: Publish npm Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Use npm trusted-publishing-capable CLI
        run: npm install -g npm@11.13.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:examples

      - name: Pack packages
        run: |
          set -euo pipefail
          mkdir -p artifacts/npm
          (cd packages/stage-protocol && pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm")
          (cd packages/stage && pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm")
          (cd packages/stage-react && pnpm pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm")
          ls -la artifacts/npm

      - name: Publish packages
        run: |
          set -euo pipefail

          publish_if_needed() {
            local package_name="$1"
            local package_version="$2"
            local tarball="$3"

            if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
              echo "${package_name}@${package_version} already exists; skipping"
            else
              npm publish "${tarball}" --access public
            fi
          }

          protocol_version="$(node -p "require('./packages/stage-protocol/package.json').version")"
          stage_version="$(node -p "require('./packages/stage/package.json').version")"
          react_version="$(node -p "require('./packages/stage-react/package.json').version")"

          publish_if_needed "@litsquare/stage-protocol" "${protocol_version}" "artifacts/npm/litsquare-stage-protocol-${protocol_version}.tgz"
          publish_if_needed "@litsquare/stage" "${stage_version}" "artifacts/npm/litsquare-stage-${stage_version}.tgz"
          publish_if_needed "@litsquare/stage-react" "${react_version}" "artifacts/npm/litsquare-stage-react-${react_version}.tgz"
